name: Release

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed

jobs:
  release:
    #if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'rework-gh-actions' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Determine next version
        id: version
        run: |
          MAJOR=1
          MINOR=0
          # Get last tag in the form x.y.z
          LAST_TAG=$(git describe --tags --match "${MAJOR}.${MINOR}.*" --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            BUILD=0
          else
            BUILD=$(( $(echo $LAST_TAG | awk -F. '{print $3}') + 1 ))
          fi
          NEXT_VERSION="${MAJOR}.${MINOR}.${BUILD}"
          echo "NEXT_VERSION=$NEXT_VERSION" >> $GITHUB_ENV
          echo "Next version will be $NEXT_VERSION"

      - name: Generate release notes
        id: release_notes
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (\`[%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H)\`)" )
          else
            COMMITS=$(git log $LAST_TAG..HEAD --pretty=format:"- %s (\`[%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H)\`)" )
          fi
          echo "RELEASE_NOTES<<EOF" >> $GITHUB_ENV
          echo "$COMMITS" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - uses: actions/download-artifact@v4
        with:
          name: yaser
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.NEXT_VERSION }}
          name: Release ${{ env.NEXT_VERSION }}
          body: ${{ env.RELEASE_NOTES }}
          draft: false
          prerelease: false
          files: yaser
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
